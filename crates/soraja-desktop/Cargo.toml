[package]
name = "soraja-desktop"
version = "0.1.0"
edition = "2021"

[dependencies]
soraja-core = { path = "../soraja-core" }
tauri = { version = "2.2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"
tokio = { version = "1", features = ["full"] }
portable-pty = "0.8"
tauri-plugin-updater = "2"

[target.'cfg(windows)'.dependencies]
# Job Object (proteksi zombie process, specs/sdd-speckit.md §7C)
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

[features]
# WAJIB untuk build rilis: meng-embed desktop-ui/dist ke dalam .exe. Tanpa fitur ini Tauri berjalan
# dalam mode dev dan memuat UI dari server Vite (devUrl) → webview ikut full-reload saat HMR.
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }
