[package]
name = "soraja-desktop"
version = "0.1.0"
edition = "2021"

[dependencies]
soraja-core = { path = "../soraja-core" }
tauri = { version = "2.2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"
tokio = { version = "1", features = ["full"] }
portable-pty = "0.8"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }
